<!doctype html>
<html lang="vi">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
		<meta name="theme-color" content="#1B2A4A" />
		<title>Toán Runner</title>
		<style>
			html,
			body {
				margin: 0;
				padding: 0;
				width: 100%;
				height: 100%;
				overflow: hidden;
				background: #1b2a4a;
			}

			#app {
				position: fixed;
				inset: 0;
			}

			#app canvas {
				display: block;
				width: 100%;
				height: 100%;
			}

			#ui-root {
				position: fixed;
				inset: 0;
				pointer-events: none;
			}
		</style>
	</head>
	<body>
		<div id="app"></div>
		<div id="ui-root"></div>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
